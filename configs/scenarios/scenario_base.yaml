scenario_name: base_h2_btc_costs2030_weather2020

system:
  snapshots: 8760
  investment_year: 2030
  weather_year: 2020
  demand_year: 2018

costs:
  active_dataset: "costs_2030"

  datasets:
    costs_2025: "technology-data/outputs/costs_2025.csv"
    costs_2030: "technology-data/outputs/costs_2030.csv"
    costs_conservative: "technology-data/outputs/costs_conservative.csv"

  discount_rate: 0.07

electricity_demand:
  source: kazakhstan_historical

hydrogen:
  enabled: false
  mode: production_target
  target_annual_kt_h2: 0.0
  electrolyzer_efficiency: 0.70
  electrolyzer_variable_cost_eur_per_mwh: 0.0
  cyclic_storage: true
  storage_standing_loss: 0.0

bitcoin:
  enabled: false
  max_capacity_mw: 200
  hashprice_eur_per_th_day: 0.08
  asic_efficiency_j_per_th: 16.0
  other_opex_eur_per_mwh: 0.0

technology:
  load_shedding_marginal_cost: 10000