scenario_name: base_h2_btc_costs2030_weather2025

system:
  snapshots: 8760
  year: 2050

costs:
  active_dataset: "costs_2050"
  datasets:
    costs_2045: "technology-data/outputs/costs_2045.csv"
    costs_2050: "technology-data/outputs/costs_2050.csv"
    costs_conservative: "technology-data/outputs/costs_conservative.csv"
  discount_rate: 0.07

demand:
  electricity_mw: 100
  hydrogen_mw: 0
  use_hourly_electricity_profile: true
  use_hourly_hydrogen_profile: true

hydrogen:
  enabled: true
  mode: flexible_sink
  electrolyzer_efficiency: 0.75
  electrolyzer_variable_cost_eur_per_mwh: 0.0
  cyclic_storage: true
  storage_standing_loss: 0.0

technology:
  load_shedding_marginal_cost: 10000

mining:
  enabled: true
  max_capacity_mw: 200
  min_utilization: 0.0
  hashprice_eur_per_th_day: 0.08
  asic_efficiency_j_per_th: 16.0
  other_opex_eur_per_mwh: 0.0