  hydrogen_mw: 20
  use_hourly_electricity_profile: true
  use_hourly_hydrogen_profile: false

costs:
  active_dataset: "costs_2030"
  datasets:
    costs_2025: "technology-data/outputs/costs_2025.csv"
    costs_2030: "technology-data/outputs/costs_2030.csv"
    costs_conservative: "technology-data/outputs/costs_conservative.csv"
  discount_rate: 0.07

data_files:
  solar_cf: data/kz_solar_cf.csv
  wind_cf: data/kz_wind_cf.csv
  electricity_demand: data/kz_electricity_demand.csv
  hydrogen_demand: data/kz_hydrogen_demand.csv

technology:
  load_shedding_marginal_cost: 5000

hydrogen:
  electrolyzer_efficiency: 0.7
  cyclic_storage: true

mining:
  enabled: true
  max_capacity_mw: 200
  min_utilization: 0.0
  hashprice_eur_per_th_day: 0.08
